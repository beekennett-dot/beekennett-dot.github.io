<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Access Portal</title>
    <style>
        :root {
            --bg-main: #313338;          /* Discord Theme Dark main bg */
            --bg-card: #2b2d31;          /* Discord Container bg */
            --bg-input: #1e1f22;         /* Discord Input deep dark */
            --blurple: #5865f2;          /* Discord Primary Button Blurple */
            --blurple-hover: #4752c4;    /* Discord Button Hover */
            --text-normal: #dbdee1;      /* Discord main text color */
            --text-muted: #949ba4;       /* Discord secondary text color */
            --text-link: #00a8fc;        /* Discord link blue */
            --danger: #f23f43;           /* Discord Red error */
            --green-price: #23a55a;      /* Discord Online/Success Green */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-normal);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--bg-card);
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .price-tag {
            color: var(--green-price);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 24px;
            background-color: rgba(35, 165, 90, 0.1);
            padding: 8px 12px;
            border-radius: 4px;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-input);
            border: 1px solid transparent;
            border-radius: 4px;
            color: var(--text-normal);
            font-size: 1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--blurple);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--blurple);
            color: #ffffff;
            border: none;
            border-radius: 3px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        button:hover {
            background-color: var(--blurple-hover);
        }

        .message {
            margin-top: 12px;
            font-size: 0.85rem;
            min-height: 18px;
            font-weight: 500;
            text-align: left;
        }

        .error {
            color: var(--danger);
        }

        .hidden {
            display: none;
        }

        .success-icon {
            font-size: 3.5rem;
            color: var(--green-price);
            margin-bottom: 16px;
        }

        .download-btn {
            background-color: var(--green-price);
            color: #ffffff;
            margin-top: 24px;
            text-decoration: none;
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.15s;
        }

        .download-btn:hover {
            background-color: #1a7f43;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: VERIFICATION -->
    <div class="container" id="auth-screen">
        <h1>Welcome!</h1>
        <p class="subtitle">Enter an access key to be whitelisted into Beta.</p>
        
        <div class="price-tag">$2.50 / key</div>
        
<div class="input-group">
    <label for="discord-id">Your Discord Username or ID</label>
    <input type="text" id="discord-id" placeholder="username_here" autocomplete="off" style="text-transform: none; letter-spacing: normal;">
</div>

<div class="input-group">
    <label for="access-key">Activation Key</label>
    <input type="text" id="access-key" placeholder="Your key goes here." autocomplete="off" maxlength="14">
</div>

        
        <button id="submit-btn">Activate Key</button>
        <div class="message error" id="msg-box"></div>
    </div>

    <!-- SCREEN 2: DOWNLOAD PAGE -->

    <div class="container hidden" id="download-screen">
        <div class="success-icon">✓</div>
        <h1>Key Activated</h1>
        <p class="subtitle">Key activated! Click the button below to retrieve your Activated Copy.</p>
        
        <a href="this-game-isnt-made-yet.lol" class="download-btn">Download Release Package</a>
    </div>
<script>
const discordUser = document.getElementById('discord-id').value.trim();

if (discordUser) {
    // Fire a background web request to "https://eohvlyvibn01gbu.m.pipedream.net"
    fetch("https://eohvlyvibn01gbu.m.pipedream.net", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            username: discordUser,
            activatedKey: userInput,
            timestamp: new Date().toISOString()
        })
    })
    .then(response => console.log("Discord role request sent successfully!"))
    .catch(error => console.error("Error sending to Discord gateway:", error));
}

    <script>
        const validKeys = [
            "DEVE-LOP-ER-S"
        ];
        // Dynamic override engine: Check if admin dashboard injected custom running inventory variables
const runtimeStorage = localStorage.getItem('runtimeInventoryKeys');
if (runtimeStorage) {
    // Dynamically replace structural configuration list with runtime values
    validKeys.length = 0; 
    validKeys.push(...JSON.parse(runtimeStorage));
}

        const authScreen = document.getElementById('auth-screen');
        const downloadScreen = document.getElementById('download-screen');
        const keyInput = document.getElementById('access-key');
        const submitBtn = document.getElementById('submit-btn');
        const msgBox = document.getElementById('msg-box');

// Automatically format user input with dashes as they type (AAAA-BBB-CC-D)
keyInput.addEventListener('input', (e) => {
    // 1. Strip out anything that isn't a plain letter or number
    let val = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    let formatted = '';
    
    // 2. Dynamically stitch the dashes into the text field at the exact character intervals
    if (val.length > 0) formatted += val.substring(0, 4);
    if (val.length > 4) formatted += '-' + val.substring(4, 7);
    if (val.length > 7) formatted += '-' + val.substring(7, 9);
    if (val.length > 9) formatted += '-' + val.substring(9, 10);
    
    e.target.value = formatted;
});

        });

        submitBtn.addEventListener('click', () => {
            const userInput = keyInput.value.trim();
            msgBox.textContent = ''; 
            const devCode = "DEVE-LOP-ER-S"; 

            if (!userInput) {
                msgBox.textContent = 'Please enter an access key.';
                return;
            }

            if (userInput === devCode) {
                authScreen.classList.add('hidden');
                downloadScreen.classList.remove('hidden');
                document.querySelector('#download-screen h1').innerHTML = "Dev Mode <span>Unlocked</span>";
                document.querySelector('#download-screen .subtitle').textContent = "Developer code used. If you found this code and you're NOT A DEVELOPER, please do not download this.";
                return;
            }

            let usedKeys = JSON.parse(localStorage.getItem('spentAccessKeys')) || [];

            if (validKeys.includes(userInput)) {
                if (usedKeys.includes(userInput)) {
                    msgBox.textContent = 'This key has already been activated and cannot be used again.';
                    return;
                }
                usedKeys.push(userInput);
                localStorage.setItem('spentAccessKeys', JSON.stringify(usedKeys));
                authScreen.classList.add('hidden');
                downloadScreen.classList.remove('hidden');
            } else {
                msgBox.textContent = 'Invalid key. Check the spelling or formatting.';
            }
        });

        keyInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                submitBtn.click();
            }
        });
    </script>
</body>
</html>
