<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Access Portal</title>
    <style>
        :root {
            --bg-main: #313338;          /* Discord Theme Dark main bg */
            --bg-card: #2b2d31;          /* Discord Container bg */
            --bg-input: #1e1f22;         /* Discord Input deep dark */
            --blurple: #5865f2;          /* Discord Primary Button Blurple */
            --blurple-hover: #4752c4;    /* Discord Button Hover */
            --text-normal: #dbdee1;      /* Discord main text color */
            --text-muted: #949ba4;       /* Discord secondary text color */
            --text-link: #00a8fc;        /* Discord link blue */
            --danger: #f23f43;           /* Discord Red error */
            --green-price: #23a55a;      /* Discord Online/Success Green */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-normal);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--bg-card);
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .price-tag {
            color: var(--green-price);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 24px;
            background-color: rgba(35, 165, 90, 0.1);
            padding: 8px 12px;
            border-radius: 4px;
            display: inline-block;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 700;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-input);
            border: 1px solid transparent;
            border-radius: 4px;
            color: var(--text-normal);
            font-size: 1rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--blurple);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--blurple);
            color: #ffffff;
            border: none;
            border-radius: 3px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        button:hover {
            background-color: var(--blurple-hover);
        }

        .message {
            margin-top: 12px;
            font-size: 0.85rem;
            min-height: 18px;
            font-weight: 500;
            text-align: left;
        }

        .error {
            color: var(--danger);
        }

        .hidden {
            display: none;
        }

        .success-icon {
            font-size: 3.5rem;
            color: var(--green-price);
            margin-bottom: 16px;
        }

        .download-btn {
            background-color: var(--green-price);
            color: #ffffff;
            margin-top: 24px;
            text-decoration: none;
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.15s;
        }

        .download-btn:hover {
            background-color: #1a7f43;
        }
    </style>
</head>
<body>

    <!-- SCREEN 1: VERIFICATION -->
    <div class="container" id="auth-screen">
        <h1>Welcome Back!</h1>
        <p class="subtitle">Enter an access key to be whitelisted into Beta.</p>
        
        <div class="price-tag">$2.50 / key</div>
        
        <div class="input-group">
            <label for="access-key">Activation Key</label>
            <input type="text" id="access-key" placeholder="AAAA-BBB-CC-D" autocomplete="off" maxlength="14">
        </div>
        
        <button id="submit-btn">Activate Key</button>
        <div class="message error" id="msg-box"></div>
    </div>

    <!-- SCREEN 2: DOWNLOAD PAGE -->
    <div class="container hidden" id="download-screen">
        <div class="success-icon">✓</div>

        <p class="subtitle">Key activated! Click the button below to retrieve your Activated Copy.</p>

    </div>
